<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>课时查询 · 幻彩教育</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#f4f6f9;color:#1f2937;font-size:15px;line-height:1.6;min-height:100vh}
.head{background:linear-gradient(135deg,#007aff,#3395ff);color:#fff;padding:26px 20px 30px;text-align:center}
.head h1{font-size:18px;font-weight:600;letter-spacing:.5px}
.head p{font-size:12.5px;opacity:.78;margin-top:6px}
.box{max-width:480px;margin:-16px auto 0;padding:0 16px 40px}
.card{background:#fff;border-radius:14px;padding:20px 18px;box-shadow:0 2px 12px rgba(15,23,42,.06)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:#6b7383;margin-bottom:6px}
input{width:100%;padding:12px 14px;font-size:16px;border:1px solid #e4e8ef;border-radius:10px;
  outline:none;font-family:inherit;background:#fafbfd}
input:focus{border-color:#007aff;background:#fff;box-shadow:0 0 0 3px #e6f4ff}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#007aff;color:#fff;
  font-size:15.5px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:4px}
.btn:active{background:#0066d6}
.hint{font-size:12.3px;color:#98a1b0;margin-top:12px;line-height:1.7}
.stu{background:#fff;border-radius:14px;padding:18px;margin-top:16px;box-shadow:0 2px 12px rgba(15,23,42,.06)}
.stu .nm{font-size:17px;font-weight:600}
.stu .sub{font-size:12.5px;color:#98a1b0;margin-top:3px}
.enr{border:1px solid #eef1f6;border-radius:11px;padding:14px;margin-top:13px;background:#fcfdfe}
.enr .c{font-size:14px;font-weight:600;margin-bottom:10px}
.big{font-size:30px;font-weight:700;color:#007aff;letter-spacing:-1px;line-height:1.1}
.big small{font-size:13px;font-weight:400;color:#98a1b0;margin-left:3px}
.row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.meta{font-size:12.5px;color:#6b7383;margin-top:9px;padding-top:9px;border-top:1px dashed #eef1f6}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:5px;background:#f0f3f8;color:#6b7383}
.tag.warn{background:#fef4e6;color:#b45309}
.tag.bad{background:#fdecea;color:#b42318}
.err{background:#fdecea;color:#b42318;padding:12px 14px;border-radius:10px;font-size:13.5px;margin-top:14px}
.foot{text-align:center;font-size:11.8px;color:#b0b8c5;margin-top:26px;line-height:1.8}
</style>
</head>
<body>
<div class="head">
  <h1>课时查询</h1>
  <p>幻彩教育 · 家长自助查询</p>
</div>

<div class="box">
  <div class="card">
    <div class="field">
      <label>学员姓名</label>
      <input id="name" placeholder="请输入孩子姓名">
    </div>
    <div class="field">
      <label>报名时预留手机号后四位</label>
      <input id="phone" maxlength="4" inputmode="numeric" placeholder="如 2424">
    </div>
    <button class="btn" onclick="query()">查询课时</button>
    <div class="hint">仅可查看课时余额与到期日，不支持任何修改。如有疑问请联系班主任。</div>
  </div>
  <div id="result"></div>
  <div class="foot">数据由校区定期同步<br>如显示有延迟，以班主任处记录为准</div>
</div>

<script>
const $ = s => document.querySelector(s);
const fmt = (n,d=1) => Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d});

async function query(){
  const name = $('#name').value.trim();
  const phone = $('#phone').value.trim();
  if(!name || phone.length < 4) return render(`<div class="err">请填写学员姓名和手机号后四位</div>`);
  const r = await fetch(`/api/parent?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}`);
  const d = await r.json();
  if(!d.ok) return render(`<div class="err">${d.msg}</div>`);

  const enrs = d.enrollments || [];
  render(`
    <div class="stu">
      <div class="nm">${d.student.name}</div>
      <div class="sub">${d.student.campus || ''}</div>
      ${enrs.length ? enrs.map(e=>`
        <div class="enr">
          <div class="c">${e.course}</div>
          <div class="row">
            <div>
              <div class="big">${fmt(e.remaining)}<small>课时</small></div>
            </div>
            <div style="text-align:right">
              ${e.expire_date ? `<span class="tag ${e.days_left<0?'bad':(e.days_left<=30?'warn':'')}">
                ${e.days_left<0?'已过期':'到期 '+e.expire_date}</span>` : ''}
            </div>
          </div>
          <div class="meta">总课时 ${fmt(e.total_hours)}　已上 ${fmt(e.used_hours)}　剩余 ${fmt(e.remaining)}</div>
        </div>`).join('') : `<div class="meta">暂无报读记录</div>`}
    </div>`);
}

function render(html){ $('#result').innerHTML = html; }
$('#phone').addEventListener('keydown', e => { if(e.key === 'Enter') query(); });
</script>
</body>
</html>
