server:
  port: 8080

spring:
  application:
    name: huancai-erp
  # 数据库：本地 MySQL 8.0.28，端口 3307，库 huancai_erp
  # 数据目录（库文件物理位置）：D:\Code\Projects\Huancai\tools\mysql-data
  # 建表脚本：src/main/resources/schema.sql
  # 说明文档：项目根目录 README.md「数据库位置」
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/huancai_erp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: hc
    password: hc123456
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  # 本地私密配置（微信 AppID / AppSecret 等）放在 application-local.yml，该文件不入库
  config:
    import: optional:classpath:application-local.yml

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    cn.huancai.erp: info

# 班级相册等上传文件的本地存储目录（相对项目根目录启动后端）
app:
  upload-dir: ./storage/uploads
  # 安卓试用 App 安装包（管理端左下角「试用手机 App」下载），每日每账号限 5 次
  apk-path: ./storage/app/huancai-app.apk
  apk-version: 1.0.0

# 家长端微信小程序
# AppID / AppSecret 为本地私密配置，写在同目录 application-local.yml（已被 .gitignore 忽略）；
# 未提供时后端进入开发模式，用本地持久化的 devOpenid 登录，便于开发者工具联调。
wx:
  miniapp:
    # 订阅消息：活动开始前提醒家长（模板类目「教育装备」）
    subscribe:
      activity-template-id: 'wx-KOL04qZ6EXqwf56Haxe09Bd3PRY-x3m3wBHiv5r4'

# 58mm 热敏小票机：本机 USB 设备接口路径（H58 Printer USB，端口 USB004）
# 该机型无厂商驱动，后端直接通过 kernel32 打开设备并写入 ESC/POS 指令
printer:
  receipt-device: '\\?\usb#vid_0456&pid_0808#printer#{28d78fad-5a12-11d1-ae5b-0000f803a8c2}'
